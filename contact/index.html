<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="contact.css">
    <script src="../global.js" type="module"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>

    <h1>Contact Me</h1>

    <form action="mailto:ktgubler@andrew.cmu.edu" enctype="text/plain" method="post">
        <div class="form-group">
            <label for="email">Email<span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>

        <div class="form-group">
            <label for="subject">Subject<span class="required">*</span></label>
            <input type="text" id="subject" name="subject" required placeholder="Subject of your message">
        </div>

        <div class="form-group">
            <label for="message">Message<span class="required">*</span></label>
            <textarea id="message" name="body" cols="30" rows="10" required placeholder="Your message here..."></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
